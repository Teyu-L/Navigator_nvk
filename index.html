<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UniNav — навигация внутри университетского корпуса: маршруты по трём этажам, поиск аудиторий и переходы по лестницам."
    />
    <title>UniNav — Навигация внутри корпуса</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Top Control Header -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-logo">🎓</div>
          <div class="brand-text">
            <h1>UniNav</h1>
            <span class="brand-sub">Навигация в корпусе</span>
          </div>
        </div>

        <!-- Point A & Point B Search Controls -->
        <div class="route-inputs-card">
          <div class="search-group">
            <div class="input-prefix start-dot">A</div>
            <input
              type="text"
              id="start-input"
              class="search-input"
              placeholder="Откуда (например, Столовая, D105)…"
              autocomplete="off"
            />
            <div id="start-dropdown" class="dropdown-list hidden"></div>
          </div>

          <div class="swap-divider">
            <button id="swap-btn" class="swap-button" title="Поменять начало и конец">
              ⇅
            </button>
          </div>

          <div class="search-group">
            <div class="input-prefix end-dot">B</div>
            <input
              type="text"
              id="end-input"
              class="search-input"
              placeholder="Куда (например, деканат, J106)…"
              autocomplete="off"
            />
            <div id="end-dropdown" class="dropdown-list hidden"></div>
          </div>
        </div>
      </header>

      <!-- Main Map Display Area -->
      <main class="map-section">
        <div id="map-container" class="map-container">
          <!-- Image and Canvas dynamically populated by MapRenderer -->
        </div>

        <div id="loading-overlay" class="loading-overlay">
          <div class="spinner"></div>
          <span>Загрузка плана этажа…</span>
        </div>

        <!-- Floating Zoom Controls -->
        <div class="floating-zoom-controls">
          <button id="zoom-in-btn" class="icon-btn" title="Приблизить">+</button>
          <button id="zoom-out-btn" class="icon-btn" title="Отдалить">−</button>
          <button id="zoom-reset-btn" class="icon-btn" title="Сбросить вид">🎯</button>
        </div>

        <!-- Floating Floor Switcher Bar -->
        <div class="floating-floor-switcher">
          <span class="switcher-title">Этаж</span>
          <div class="floor-btn-group">
            <button id="floor-btn-1" class="floor-btn active">1</button>
            <button id="floor-btn-2" class="floor-btn">2</button>
            <button id="floor-btn-3" class="floor-btn">3</button>
          </div>
        </div>
      </main>

      <!-- Bottom Sheet / Route Navigation Footer -->
      <footer class="app-footer">
        <div id="route-info" class="route-info-box hidden">
          <!-- Статус маршрута (заполняется UIController) -->
        </div>

        <!-- Multi-floor segment bar -->
        <div id="segment-bar" class="segment-bar hidden">
          <!-- Step buttons populated by UIController -->
        </div>

        <div class="footer-actions">
          <button id="clear-btn" class="btn btn-secondary">Сбросить маршрут</button>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
